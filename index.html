<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Mehndi Artist in Mumbai | Bridal Mehndi by Afroz</title>
    <script>
      // Prevent libraries from trying to overwrite window.fetch
      if (window.fetch) {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: false,
            enumerable: true,
            get: () => originalFetch,
            set: () => { console.warn('Attempt to overwrite window.fetch blocked.'); }
          });
        } catch (e) {
          // If defineProperty fails, we just ignore it
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
